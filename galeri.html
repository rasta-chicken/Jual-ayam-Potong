<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeri</title>
<style>
    
/* MENU GARIS 3 */
.menu-toggle {
  position:fixed;
  top:15px;
  left:15px;
  font-size:25px;
  color:#000;
  cursor:pointer;
  z-index:1000;
}

/* SIDEBAR COMPACT */
.sidebar {
  position:fixed;
  top:60px;
  left:15px;
  width:200px;
  background:#111;
  border-radius:10px;
  overflow:hidden;
  transform: scale(0);
  transform-origin: top left;
  transition:0.2s ease;
  z-index:999;
}

.sidebar.active {
  transform: scale(1);
}

.sidebar a {
  display:block;
  color:white;
  padding:12px;
  text-decoration:none;
  border-bottom:1px solid #333;
  font-size:14px;
}

.sidebar a:hover {
  background:#0a8f3c;
}

/* TOMBOL BACK / TUTUP */
.close-btn {
  display:block;
  text-align:right;
  padding:10px;
  cursor:pointer;
  background:#000;
  color:white;
  font-size:14px;
}
    
/* HEADER ATAS */
.topbar {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:50px;
  background:#ffffff;
  border-bottom:2px solid #ccc;
  z-index:999;
}

/* tombol menu tetap di atas */
.menu-toggle {
  position:fixed;
  top:10px;
  left:15px;
  z-index:1000;
}
 
/* isi turun supaya tidak ketutup */
body{
    font-family:Arial, sans-serif;
    padding-top:60px;
    padding-left:20px;
    padding-right:20px;
    padding-bottom:90px;
    background:linear-gradient(180deg,#E8F5E9,#C8E6C9);
}  
 
/* TOMBOL WA */
.btn-wa {
  position:fixed;
  bottom:50px;
  font-weight:bold;
  right:20px;
  background:#25D366;
  color:white;
  padding:8px;
  border-radius:50%;
  font-size:15px;
  text-align:center;
  text-decoration:none;
  box-shadow:0 5px 10px rgba(0,0,0,0.3);
  box-shadow: 0 6px 0 #1da851;
  transition: all 0.1s ease;
  cursor:grab;
}

.btn-wa:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #1da851;
}    
   
/* Efek saat diarahkan mouse (Laptop) */
.btn-wa:hover{
    transform:translateY(-3px) scale(1.05);
    background:#2EEA72;
    box-shadow:0 8px 15px rgba(0,0,0,.35);
}

/* Efek saat disentuh (HP) */
.btn-wa:active{
    transform:translateY(2px) scale(.97);
    background:#1EBE5A;
    box-shadow:0 3px 0 #14893F;
}  
  
/* TOMBOL kembali */    
.btn-back {
  position:fixed;
  bottom:20px;
  left:15px;
  color:purple;            /* warna ungu */
  text-decoration:underline; /* garis bawah */
  font-size:14px;
  background:none;
  padding:0;
  z-index:1000;
} 
    
/* GARIS BATAS BAWAH */     
.back-wrapper {
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#fff;
  border-top:2px solid #ccc; /* garis pembatas */
  padding:20px 15px;
  z-index:999;
}
 /* jarak judul galeri dan folder */  
h2{
  text-align:center;
  margin-bottom:45px;
}  
  
.folder{
    background:#ffffff;
    border:2px solid #0A8F3C;
    border-radius:10px;
    padding:15px;
    margin:12px 0;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,.15);
    transition:.25s;
}

.folder.active{
    background:#0A8F3C;
    color:#fff;
}  
  
.folder:hover{
    transform:translateX(5px);
    background:#E8F5E9;
}
  
.folder.active{
    background:#0A8F3C;
    color:#fff;
}  

.isi-folder{
    display:none;
    margin-bottom:20px;
    animation:fade .3s;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(-10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.foto{
    width:100%;
    border-radius:12px;
    margin:10px 0;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
}
  
/* ===== LIGHTBOX ===== */

.lightbox{
    display:none;
    position:fixed;
    z-index:99999;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.9);
    justify-content:center;
    align-items:center;
}

.lightbox-img{
    max-width:95%;
    max-height:90%;
    border-radius:12px;
    box-shadow:0 0 20px rgba(255,255,255,.3);
    animation:zoom .25s;
}

.close-lightbox{
    position:absolute;
    top:20px;
    right:25px;
    color:#fff;
    font-size:40px;
    cursor:pointer;
}

@keyframes zoom{
    from{
        transform:scale(.8);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}  
</style>
</head>
<body>
    
<div class="topbar"></div>    
    
<!-- MENU -->
<div class="menu-toggle" onclick="toggleMenu()">☰</div>

<div class="sidebar" id="menu">
  <div class="close-btn" onclick="toggleMenu()">✖</div>
  <a href="index.html">Beranda</a>
  <a href="tentang.html">Tentang</a>
  <a href="galeri.html">Galeri</a>
  <a href="kontak.html">Kontak</a>
  <a href="order.html">Pesan Sekarang</a>
</div>    
  
<h2>📸 Galeri RASTA Chicken</h2>

<div class="folder" onclick="toggleFolder('hidup')">
📁 Ayam Hidup (3)
</div>

<div id="hidup" class="isi-folder">
    <img src="foto.jpg" class="foto" onclick="lihatFoto(this)">
    <img src="foto%201.png" class="foto" onclick="lihatFoto(this)">
    <img src="ayam.jpg" class="foto" onclick="lihatFoto(this)">
</div>

<div class="folder" onclick="toggleFolder('beku')">
📁 Ayam Beku (2)
</div>

<div id="beku" class="isi-folder">
    <img src="ayambeku.jpeg" class="foto" onclick="lihatFoto(this)">
    <img src="2 ayam beku.jpeg" class="foto" onclick="lihatFoto(this)">
    <img src="beku3.jpg" class="foto" onclick="lihatFoto(this)">
</div>

<div class="folder" onclick="toggleFolder('potong')">
📁 Proses Potong (2)
</div>

<div id="potong" class="isi-folder">
    <img src="potong1.jpeg" class="foto" onclick="lihatFoto(this)">
    <img src="sudah potong2.jpeg" class="foto" onclick="lihatFoto(this)">
</div>

<div class="folder" onclick="toggleFolder('freezer')">
📁 Freezer (0)
</div>

<div id="freezer" class="isi-folder">
    <img src="freezer1.jpg" class="foto" onclick="lihatFoto(this)">
    <img src="freezer2.jpg" class="foto" onclick="lihatFoto(this)">
</div>

<div class="folder" onclick="toggleFolder('kemasan')">
📁 Kemasan (0)
</div>

<div id="kemasan" class="isi-folder">
    <img src="kemasan1.jpg" class="foto">
    <img src="kemasan2.jpg" class="foto">
</div>

<div class="back-wrapper">
  <a href="#" onclick="goBack()" class="btn-back">← Kembali</a>
</div>

<a href="order.html" class="btn-wa" id="dragBtn">PESAN<br>SEKARANG</a>
    
<script>
function toggleMenu() {
  document.getElementById("menu").classList.toggle("active");
}
    
function goBack() {
  window.history.back();
}
  
/* AGAR TOMBOL PESAN BISA DI GESER2 */
const btn = document.getElementById("dragBtn");

let isDragging = false;
let offsetX, offsetY;

btn.addEventListener("touchstart", startDrag);
btn.addEventListener("mousedown", startDrag);

function startDrag(e) {
  isDragging = true;
  const t = e.touches ? e.touches[0] : e;
  offsetX = t.clientX - btn.offsetLeft;
  offsetY = t.clientY - btn.offsetTop;
}

document.addEventListener("touchmove", drag);
document.addEventListener("mousemove", drag);

function drag(e) {
  if (!isDragging) return;
  const t = e.touches ? e.touches[0] : e;

  btn.style.left = (t.clientX - offsetX) + "px";
  btn.style.top = (t.clientY - offsetY) + "px";
  btn.style.right = "auto";
  btn.style.bottom = "auto";
}

document.addEventListener("touchend", snapToSide);
document.addEventListener("mouseup", snapToSide);

function snapToSide() {
  if (!isDragging) return;
  isDragging = false;

  const screenWidth = window.innerWidth;
  const btnRect = btn.getBoundingClientRect();
  const btnCenter = btnRect.left + btnRect.width / 2;

  // kalau di kiri layar
  if (btnCenter < screenWidth / 2) {
    btn.style.left = "10px";
  } else {
    btn.style.left = (screenWidth - btnRect.width - 10) + "px";
  }
}
  
function toggleFolder(id){

    // Tutup semua folder
    document.querySelectorAll(".isi-folder").forEach(function(el){
        if(el.id !== id){
            el.style.display = "none";
        }
    });

    // Hapus warna aktif dari semua folder
    document.querySelectorAll(".folder").forEach(function(el){
        el.classList.remove("active");
    });

    // Folder yang dipilih
    let isi = document.getElementById(id);

    // Tombol folder yang diklik
    let tombol = document.querySelector('[onclick="toggleFolder(\''+id+'\')"]');

    if(isi.style.display === "block"){
        isi.style.display = "none";
    }else{
        isi.style.display = "block";
        tombol.classList.add("active");
    }

}
  
/* ===== LIGHTBOX ===== */

function lihatFoto(img){
    document.getElementById("fotoBesar").src = img.src;
    document.getElementById("lightbox").style.display="flex";
}
  
function tutupFoto(){
    document.getElementById("lightbox").style.display="none";
}  
</script>    

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox" onclick="tutupFoto()">
    <span class="close-lightbox">&times;</span>
    <img id="fotoBesar" class="lightbox-img">
</div>
</body>
</html>
