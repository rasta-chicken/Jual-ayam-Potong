<!DOCTYPE html>
<html>
<head>
<title>Galeri</title>
<style>
    
/* MENU GARIS 3 */
.menu-toggle {
  position:fixed;
  top:15px;
  left:15px;
  font-size:25px;
  color:#000;
  cursor:pointer;
  z-index:1000;
}

/* SIDEBAR COMPACT */
.sidebar {
  position:fixed;
  top:60px;
  left:15px;
  width:200px;
  background:#111;
  border-radius:10px;
  overflow:hidden;
  transform: scale(0);
  transform-origin: top left;
  transition:0.2s ease;
  z-index:999;
}

.sidebar.active {
  transform: scale(1);
}

.sidebar a {
  display:block;
  color:white;
  padding:12px;
  text-decoration:none;
  border-bottom:1px solid #333;
  font-size:14px;
}

.sidebar a:hover {
  background:#0a8f3c;
}

/* TOMBOL BACK / TUTUP */
.close-btn {
  display:block;
  text-align:right;
  padding:10px;
  cursor:pointer;
  background:#000;
  color:white;
  font-size:14px;
}
    
/* HEADER ATAS */
.topbar {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:50px;
  background:#ffffff;
  border-bottom:2px solid #ccc;
  z-index:999;
}

/* tombol menu tetap di atas */
.menu-toggle {
  position:fixed;
  top:10px;
  left:15px;
  z-index:1000;
}

/* isi turun supaya tidak ketutup */
body {
  padding-top:60px;
}        
    
/* TOMBOL WA */
.btn-wa {
  position:fixed;
  bottom:50px;
  font-weight:bold;
  right:20px;
  background:#25D366;
  color:red;
  padding:8px;
  border-radius:50%;
  font-size:15px;
  text-align:center;
  text-decoration:none;
  box-shadow:0 5px 10px rgba(0,0,0,0.3);
  box-shadow: 0 6px 0 #1da851;
  transition: all 0.1s ease;
}

.btn-wa:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #1da851;
}    
   
/* TOMBOL kembali */    
.btn-back {
  position:fixed;
  bottom:20px;
  left:15px;
  color:purple;            /* warna ungu */
  text-decoration:underline; /* garis bawah */
  font-size:14px;
  background:none;
  padding:0;
  z-index:1000;
} 
    
/* GARIS BATAS BAWAH */     
.back-wrapper {
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#fff;
  border-top:2px solid #ccc; /* garis pembatas */
  padding:20px 15px;
  z-index:999;
}    
</style>
</head>
<body style="font-family:Arial; padding:20px;">
    
<div class="topbar"></div>    
    
<!-- MENU -->
<div class="menu-toggle" onclick="toggleMenu()">☰</div>

<div class="sidebar" id="menu">
  <div class="close-btn" onclick="toggleMenu()">✖</div>
  <a href="index.html">Beranda</a>
  <a href="tentang.html">Tentang</a>
  <a href="galeri.html">Galeri</a>
  <a href="kontak.html">Kontak</a>
  <a href="order.html">Pesan Sekarang</a>
</div>    

<h2 style="text-align: center">Galeri RASTA Chicken</h2>

<img src="foto%201.png" width="100%"><br><br>
<img src="foto.jpg" width="100%">

<div class="back-wrapper">
  <a href="#" onclick="goBack()" class="btn-back">← Kembali</a>
</div>

<a href="order.html" class="btn-wa">PESAN<br>SEKARANG</a>
    
<script>
function toggleMenu() {
  document.getElementById("menu").classList.toggle("active");
}
    
function goBack() {
  window.history.back();
}    
</script>    

</body>
</html>
