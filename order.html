<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RASTA Chicken - Order Ayam Broiler</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #d6d6d6;
  padding-bottom: 90px;
}

/* MENU GARIS 3 */
.menu-toggle {
  position:fixed;
  top:15px;
  left:15px;
  font-size:25px;
  color:#000;
  cursor:pointer;
  z-index:1000;
}

/* SIDEBAR COMPACT */
.sidebar {
  position:fixed;
  top:60px;
  left:15px;
  width:200px;
  background:#111;
  border-radius:10px;
  overflow:hidden;
  transform: scale(0);
  transform-origin: top left;
  transition:0.2s ease;
  z-index:999;
}

.sidebar.active {
  transform: scale(1);
}

.sidebar a {
  display:block;
  color:white;
  padding:12px;
  text-decoration:none;
  border-bottom:1px solid #333;
  font-size:14px;
}

.sidebar a:hover {
  background:#0a8f3c;
}

/* TOMBOL BACK / TUTUP di garis 3 */
.close-btn {
  display:block;
  text-align:right;
  padding:10px;
  cursor:pointer;
  background:#000;
  color:white;
  font-size:14px;
}  

header {
  background: linear-gradient(135deg, #2e7d32, #66bb6a);
  color: white;
  text-align: center;
  padding: 25px;
  border-bottom-left-radius: 25px;
  border-bottom-right-radius: 25px;
}

header h1 { margin: 0; font-size: 22px; }
header p { margin: 5px 0 0; font-size: 14px; }

.container {
  padding: 15px;
  max-width: 600px;
  margin: auto;
}

.card {
  background: transparent;
  backdrop-filter: none;
  padding: 0;
  border-radius: 0;
  box-shadow: none;
}

.info {
  background: #e8f5e9;
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 15px;
  font-size: 13px;
  border-left: 4px solid #2e7d32;
}

.input-group {
  display: flex;
  align-items: center;
  background: #fafafa;
  border: 1px solid #ccc;
  border-radius: 10px;
  padding: 0 10px;
  margin-top: 8px;
  margin-bottom: 12px;
}

.input-group span {
  margin-right: 8px;
  font-size: 16px;
}

.input-group input,
.input-group select,
.input-group textarea {
  border: none;
  outline: none;
  flex: 1;
  padding: 11px 0;
  background: transparent;
  font-size: 14px;
}

option[disabled] {
  font-style: italic;
  color: #999;
}

.option-group {
  display: flex;
  gap: 10px;
  margin-top: 8px;
  margin-bottom: 12px;
}

.option-btn {
  flex: 1;
  height: 40px;
  border: 2px solid #2e7d32; /* garis keliling */
  background: #e8f5e9;
  color: #2e7d32;
  border-radius: 10px;
  font-size: 12px;
  cursor: pointer;
  transition: 0.25s;
}
.option-btn.active {
  background: linear-gradient(135deg, #2e7d32, #66bb6a);
  color: white;
}

button.main {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #2e7d32, #66bb6a);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
}

textarea {
  min-height: 90px;
  resize: vertical;
}
/* hanya pilihan yang tebal */
.input-group select {
  font-weight: bold;
}

/* tombol juga tebal */
.option-btn {
  font-weight: bold;
}

button.main {
  font-weight: bold;
}
.input-group {
  position: relative;
}

.check {
  position: absolute;
  right: 10px;
  color: #4caf50;
  font-size: 16px;
  display: none;
}

.input-group.filled .check {
  display: block;
}

.input-group input {
  padding-right: 30px;
}
  
#totalBayar {
  color: #d32f2f !important;
  font-weight: bold !important;
  font-size: 18px;
}

.wa-btn-pro {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 16px;
  border: none;
  background: #1f7a3a; /* hijau tua profesional */
  color: white;
  font-size: 15px;
  font-weight: bold;
  border-radius: 10px;
  cursor: pointer;
  box-shadow: 0 6px 15px rgba(0,0,0,0.2);
  transition: 0.2s ease;
}

.wa-btn-pro:hover {
  background: #16602d;
}

.wa-btn-pro:active {
  transform: scale(0.98);
}

.wa-icon-pro {
  width: 22px;
  height: 22px;
}
  
.judul-form {
  text-align: center;
  font-size: 18px;
  margin-bottom: 15px;
  font-weight: bold;
}
  
.wa-btn-fixed {
  position: fixed;
  bottom: 15px;
  left: 15px;
  right: 15px;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 16px;
  border: none;
  background: #1f7a3a;
  color: white;
  font-size: 15px;
  font-weight: bold;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 6px 15px rgba(0,0,0,0.25);
}
  
body::after{
  content:"";
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:85px;
  background:#d6d6d6;
  z-index:9998;
  border-top:1px solid #a6a6a6;
}  
</style>
</head>

<body>

<!-- MENU garis 3-->
<div class="menu-toggle" onclick="toggleMenu()">☰</div>

<div class="sidebar" id="menu">
  <div class="close-btn" onclick="toggleMenu()">✖</div>
  <a href="index.html">Beranda</a>
  <a href="tentang.html">Tentang</a>
  <a href="galeri.html">Galeri</a>
  <a href="kontak.html">Kontak</a>
  <a href="order.html">Pesan Sekarang</a>
</div>  
  
<header>
  <h1>RASTA Chicken</h1>
  <p>Ayam Segar | Potong Gratis | Bersih Gratis</p>
</header>

<div class="container">
<div class="card">

  <h2 class="judul-form" style="color: #49894c">FORM PEMESANAN</h2>

<div class="input-group checkable">
  <span>👤</span>
  <input type="text" id="nama" placeholder="Nama Anda">
  <span class="check">✔</span>
</div>

<div class="input-group checkable">
  <span>📱</span>
  <input type="tel" id="hp" placeholder="Nomor WhatsApp">
  <span class="check">✔</span>
</div>

<div class="input-group checkable">
  <span>🐔</span>
  <select id="jenis">
    <option value="">Pilih Jenis Ayam</option>
    <option>Ayam Hidup</option>
    <option>Ayam Potong</option>
  </select>
  <span class="check">✔</span>
</div>

<div class="input-group checkable">
  <span>🔢</span>
  <input type="number" id="jumlah" placeholder="Jumlah (ekor)">
  <span class="check">✔</span>
</div>

<div class="input-group checkable">
  <span>💰</span>
  <select id="harga">
    <option value="">Pilih Harga / Berat Hidup</option>
    <option value="50000">Rp50rb (0.8-1.0 kg) ✅Ready</option>
    <option value="55000" disabled>Rp55rb (1.0-1.2 kg) ❌Stok Habis</option>
    <option value="65000" disabled>Rp65rb (1.3-1.4 kg) ❌Stok Habis</option>
    <option value="75000" disabled>Rp75rb (1.5-1.6 kg) ❌Stok Habis</option>
    <option value="80000" disabled>Rp80rb (1.7-1.8 kg) ❌Stok Habis</option>
    <option value="90000" disabled>Rp90rb (1.9-2.0 kg) ❌Stok Habis</option> 
    <option value="95000" disabled>Rp95rb (2.1-2.2 kg) ❌Stok Habis</option>
    <option value="100000" disabled>Rp100rb (2.3-2.5 kg) ❌Stok Habis</option>
  </select>
  <span class="check">✔</span>
</div>

<div class="input-group checkable">
  <span>🔪</span>
  <select id="layanan" onchange="togglePotongan()">
    <option value="">Pilih Layanan</option>
    <option>Tidak</option>
    <option>Bersih Bulu Saja</option>
    <option>Bersihkan Bulu + Potong</option>
  </select>
  <span class="check">✔</span>
</div>

<div class="input-group checkable" id="potongan-group" style="display:none;">
  <span>🍗</span>
  <select id="potongan">
    <option value="">Pilih Jumlah Potongan</option>
    <option>4 potong /ekor</option>
    <option>8 potong /ekor</option>
    <option>10 potong /ekor</option>
    <option>12 potong /ekor</option>
    <option>14 potong /ekor</option>
    <option>16 potong /ekor</option>
    <option>18 potong /ekor</option>
    <option>20 potong /ekor</option>
    <option>22 potong /ekor</option>
  </select>
  <span class="check">✔</span>
</div>

<label><b>Pengambilan</b></label>
<div class="option-group">
  <button type="button" class="option-btn" onclick="setPengambilan(this,'Ambil di tempat')">📦 Ambil di tempat</button>
  <button type="button" class="option-btn" onclick="setPengambilan(this,'Diantar ke rumah')">🚚 Antar ke rumah</button>
</div>

<div class="input-group checkable" id="alamat-group" style="display:none;">
  <span>📍</span>
  <textarea id="alamat" placeholder="Alamat lengkap (jika di antar)"></textarea>
  <span class="check">✔</span>
</div>

<div class="input-group">
  <span>🧾</span>
  <input type="text" id="totalHarga" placeholder="Total Harga" readonly>
</div>

<div class="input-group">
  <span>🚚</span>
  <input type="text" id="ongkir" placeholder="Ongkir" readonly>
</div>

<div class="input-group">
  <span>💰</span>
  <input type="text" id="totalBayar" placeholder="Total Bayar" readonly>
</div>
  
<button class="wa-btn-fixed" onclick="kirimWA()">
  <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" class="wa-icon-pro">
  <span>Pesan Sekarang via WhatsApp</span>
</button>

</div>
</div>

<script>
function toggleMenu() {
  document.getElementById("menu").classList.toggle("active");
}
let pengambilanTerpilih = "";
const ONGKIR = 5000;

/* ========== PENGAMBILAN ========== */
function setPengambilan(el, value) {
  document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('active'));
  el.classList.add('active');
  pengambilanTerpilih = value;

  const alamatGroup = document.getElementById('alamat-group');
  const alamat = document.getElementById('alamat');

  if (value === "Diantar ke rumah") {
    alamatGroup.style.display = "flex"; // tampil
  } else {
    alamatGroup.style.display = "none"; // sembunyi
    alamat.value = "";
  }

  hitungTotal();
}

/* ========== HITUNG TOTAL ========== */
function hitungTotal() {
  let harga = parseInt(document.getElementById('harga').value) || 0;
  let jumlah = parseInt(document.getElementById('jumlah').value) || 0;

  let totalHarga = harga * jumlah;
  let ongkir = (pengambilanTerpilih === "Diantar ke rumah") ? ONGKIR : 0;
  let totalBayar = totalHarga + ongkir;

  document.getElementById('totalHarga').value =
  "Total Harga: Rp " + totalHarga.toLocaleString();

document.getElementById('ongkir').value =
  "Ongkir: Rp " + ongkir.toLocaleString();

document.getElementById('totalBayar').value =
  "Total Bayar: Rp " + totalBayar.toLocaleString();
}

/* ========== EVENT LISTENER ========== */
document.querySelectorAll('#harga, #jumlah').forEach(el => {
  el.addEventListener('input', hitungTotal);
  el.addEventListener('change', hitungTotal);
});
  
document.getElementById('layanan').addEventListener('change', hitungTotal);
  
/* ========== VALIDASI CEKLIST ========== */
document.querySelectorAll('.checkable input, .checkable select, .checkable textarea')
.forEach(el => {
  el.addEventListener('input', function() {
    let group = this.parentElement;

    if (this.id === "hp") {
      if (this.value.trim().length >= 12) {
        group.classList.add('filled');
      } else {
        group.classList.remove('filled');
      }
    } else {
      if (this.value.trim() !== "") {
        group.classList.add('filled');
      } else {
        group.classList.remove('filled');
      }
    }
  });
});

/* ========== PANGGIL AWAL ========== */
hitungTotal();
  
  function togglePotongan() {
  const layanan = document.getElementById('layanan').value;
  const potonganGroup = document.getElementById('potongan-group');

  if (layanan === "Bersihkan Bulu + Potong") {
    potonganGroup.style.display = "flex";
  } else {
    potonganGroup.style.display = "none";
    document.getElementById('potongan').value = "";
  }
}

/* ========== KIRIM WA ========== */
function kirimWA() {
  var nama = document.getElementById('nama').value;
  var hp = document.getElementById('hp').value;
  var jenis = document.getElementById('jenis').value;
  var jumlah = document.getElementById('jumlah').value;

  var hargaSelect = document.getElementById('harga');
  var hargaText = hargaSelect.options[hargaSelect.selectedIndex].text;
  var layanan = document.getElementById('layanan').value;
  var potongan = document.getElementById('potongan').value;
  var alamat = document.getElementById('alamat').value;
  var totalBayar = document.getElementById('totalBayar').value;

  if (!nama || !hp || !jenis || !jumlah || !hargaSelect.value || !layanan || !pengambilanTerpilih) {
    alert("Lengkapi dulu semua data!");
    return;
  }

  // WAJIB pilih potongan jika pilih layanan potong
if (layanan === "Bersihkan Bulu + Potong" && !potongan) {
  alert("Pilih jumlah potongan dulu!");
  return;
}
  
  if (jumlah <= 0) {
  alert("Jumlah harus lebih dari 0!");
  return;
}
    
  if (pengambilanTerpilih === "Diantar ke rumah" && !alamat) {
    alert("Isi alamat dulu!");
    return;
  }
  
  if (!/^(08|628|\+628)\d{8,11}$/.test(hp)) {
    alert("Nomor WhatsApp tidak valid!");
    return;
  }

  var pesan =
`*Halo kak, saya mau pesan ayam...*

👤 Nama   : *${nama}*
📱 WA       : *${hp}*
🐔 Jenis   : *${jenis}*
🔢 Jumlah: *${jumlah}* ekor
💰 Harga   : *${hargaText}*
🔪 Layanan: *${layanan}*
${potongan ? "🍗 Potongan: *" + potongan + "*\n" : ""}📦 Pengambilan: *${pengambilanTerpilih}*
${pengambilanTerpilih === "Diantar ke rumah" ? "📍 Alamat: *" + alamat + "*\n" : ""}💰 Total Bayar: *${totalBayar.replace("Total Bayar: ","")}*`;

  window.open(
    "https://wa.me/6281529259407?text=" + encodeURIComponent(pesan),
    "_blank"
  );
}
</script>
</body>
</html>
