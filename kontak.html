<script>
function toggleMenu() {
  document.getElementById("menu").classList.toggle("active");
}
    
function goBack() {
  window.history.back();
}

/* AGAR TOMBOL PESAN BISA DI GESER2 */
const btn = document.getElementById("dragBtn");

let isDragging = false;
let offsetX, offsetY;

btn.addEventListener("touchstart", startDrag);
btn.addEventListener("mousedown", startDrag);

function startDrag(e) {
  isDragging = true;
  const t = e.touches ? e.touches[0] : e;
  offsetX = t.clientX - btn.offsetLeft;
  offsetY = t.clientY - btn.offsetTop;
}

document.addEventListener("touchmove", drag);
document.addEventListener("mousemove", drag);

function drag(e) {
  if (!isDragging) return;
  const t = e.touches ? e.touches[0] : e;

  btn.style.left = (t.clientX - offsetX) + "px";
  btn.style.top = (t.clientY - offsetY) + "px";
  btn.style.right = "auto";
  btn.style.bottom = "auto";
}

document.addEventListener("touchend", snapToSide);
document.addEventListener("mouseup", snapToSide);

function snapToSide() {
  if (!isDragging) return;
  isDragging = false;

  const screenWidth = window.innerWidth;
  const btnRect = btn.getBoundingClientRect();
  const btnCenter = btnRect.left + btnRect.width / 2;

  // kalau di kiri layar
  if (btnCenter < screenWidth / 2) {
    btn.style.left = "10px";
  } else {
    btn.style.left = (screenWidth - btnRect.width - 10) + "px";
  }
}    
</script>
